[package]
name = "boogy-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for building Boogy Wasm components"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Boogy-ai/boogy-sdk"
homepage = "https://boogy.ai"

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
matchit = { workspace = true }
uuid = { workspace = true }
# Format-level auth primitives (api_key + error) — the public, wasm-clean
# core. The full boogy-auth (PASETO, key files) is host-side only and
# stays out of the SDK dep graph entirely.
boogy-auth-core = { path = "../boogy-auth-core" }
garde = { workspace = true }
# JsonSchema derive used by `McpServer::tool_typed` to derive tool
# `inputSchema` from typed Rust structs. The derive macro emits
# absolute `::schemars::*` paths so this is a direct dep.
schemars = { workspace = true }
# Backs `Req::parse_query::<T>()` — the same struct-driven extractor
# pattern as `validate_body`, but for `?cursor=...&limit=...` query
# strings. Pure-Rust, no I/O, wasm-friendly.
serde_urlencoded = { workspace = true }
# Backs `boogy_sdk::ids::IdCodec` — deterministic u64↔opaque-string
# codec via raw AES-128 single-block cipher. Pure-Rust, wasm-friendly.
aes = "0.8"
base64 = "0.22"
boogy-sdk-macros = { path = "../boogy-sdk-macros" }
# Protobuf RPC (Router::grpc / GrpcDispatcher). buffa is the wasm-safe
# runtime generated message types depend on — never `connectrpc` from a
# guest, which pulls `wasm-bindgen-futures` on any wasm32 target and which
# a guest never needs, since it dispatches through `GrpcDispatcher` rather
# than connectrpc's own router or client. Default features only: the JSON
# codec goes through `serde_json` directly against the generated types' own
# `Serialize`/`Deserialize` impls (which buffa's codegen emits
# unconditionally, not behind a Cargo feature), not through a `buffa::json`
# encode/decode entry point — no such function exists in buffa 0.9.2. See
# `grpc.rs`'s `CODEC_HEADER` dispatch for the codec selection this feeds.
buffa = { workspace = true }

[dev-dependencies]
# Compile-fail harness for the counter-column index rejection. A plain version
# rather than `workspace = true` so the assembled public workspace resolves it
# from crates.io without needing a matching workspace entry.
trybuild = "1"
