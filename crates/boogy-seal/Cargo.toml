[package]
name = "boogy-seal"
version = "0.1.0"
edition = "2021"

[dependencies]
rsa = { version = "0.9", features = ["sha2"] }
aes-gcm = "0.11"
sha2 = { workspace = true }
secrecy = "0.10"
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
hex = "0.4"
zeroize = "1"
